<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CJL Onboarding System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .section-card { margin-bottom: 1.5rem; border-left: 4px solid #0d6efd; }
        .section-title { color: #0d6efd; font-weight: 600; }
        .required-label::after { content: " *"; color: #dc3545; }
        .table-sm input { font-size: 0.85rem; }
        .ts-wrapper.single .ts-control { padding: 0.25rem 0.5rem; font-size: 0.875rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand mb-0 h1 d-flex align-items-center" href="/">
                <img src="/static/images/cjl.jpg" alt="CJL Logo" style="height: 40px; margin-right: 15px; border-radius: 5px;">
                <span>CJL Creative Ideas Marketing</span>
            </a>
            <span class="text-light small">Onboarding Portal</span>
        </div>
    </nav>
    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>
    <footer class="text-center text-muted small py-3">
        CJL Creative Ideas Marketing &mdash; Javier Díaz | César Galaviz | Leonel Tapia
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
